name: CI

# Thin trigger for the local gate suite — checks live in .tooling/ and
# run offline; this only re-runs `task ci` on pull requests so external
# contributors get a status check. Visibility-guarded: free on public
# repositories, refuses to run on private ones (never consumes minute
# quota).

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the docs gate resolves references against history
      - name: Install go-task
        # The release download can answer 504 for minutes at a time; try again before failing the gate
        run: |
          for attempt in 1 2 3 4 5; do
            sudo sh -c "$(curl --fail --silent --show-error --location --retry 3 https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin && break
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 15))
          done
          task --version
      - name: Run the local gate suite
        run: task ci
