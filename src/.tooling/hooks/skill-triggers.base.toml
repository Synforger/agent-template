# どの操作の時に、 どの skill を読ませるか (= 型が配る skill の行。 skill_gate.py が読む型の表)。
#
# 型が全エージェントへ配る file で、 派生は書き換えない。 派生だけの skill と、 型の行へ足す条件は、
# 派生の skill-triggers.toml に書く (= 同じ name の行は条件が足され、 off = true で型の行を外す)。
# 派生に SKILL.md の無い skill の行は黙る。
#
# 1 つの [[skill]] が 1 本の skill。 [[skill.when]] のどれかが当たり、 その session の会話の記録に
# その skill を読んだ跡が無い時だけ、 1 回止めて (= 発話・起動は 1 行の注意で) 読ませる。
# 条件の書き方は skill_triggers.py の先頭。 {root} はその agent の folder。
# 当たる操作の決まっていない skill (= review-rules) は書かない (= 一覧の説明に任せる)。

[[skill]]
name = "code-writing"
[[skill.when]]
tools = ["Write", "Edit", "MultiEdit", "NotebookEdit"]
code = true
[[skill.when]]
tools = ["Bash"]
# 連絡の本文や報告を置く _scratch/ と session の一時の置き場 scratchpad/ を作るだけの mkdir は、 code の置き場を決める操作ではないので当てない (= 引数のどれか 1 つでもその外なら当てる。 旗・redirect・注釈は引数に数えない)
command = '\bmkdir\b(?:[ \t]+[^\s;&|<>#][^\s;&|<>]*)*?[ \t]+(?!-|\d*[<>]|[^\s;&|<>]*(?:_scratch|/scratchpad)(?:/|[\x22\x27]?(?:[\s;&|<>)]|$)))[^\s;&|<>#]'

[[skill]]
name = "sub-agent"
# 体は子のタブだけ (= サブエージェントと Workflow は subagent_gate が止める)
[[skill.when]]
tools = ["Bash"]
command = '\btabs\s+new\b'
# 言語 model を program から呼ぶ命令 (= § API とサブスクの使い分け)
[[skill.when]]
tools = ["Bash"]
command = '\bclaude\s+(-p|--print)\b|\btabs\s+ask\b|anthropic[-_]api[-_]key|ANTHROPIC_API_KEY|api\.anthropic\.com'
# 子のタブ (= AGENT_CHILD=1) の起動と締めは、 CLAUDE.md の手順の代わりに § 子の側の決まり で行う
[[skill.when]]
event = "SessionStart"
env = ["AGENT_CHILD=1"]
[[skill.when]]
event = "UserPromptSubmit"
env = ["AGENT_CHILD=1"]
prompt = '<session-rollover phase="close">'

[[skill]]
name = "pwa-client:tabs"
# 子の側の手順の本体は client の plugin が持つ (= client の無い器では黙る)
file = "{platform}/tools/claude-pwa-client/skills/tabs/SKILL.md"
[[skill.when]]
event = "SessionStart"
env = ["AGENT_CHILD=1"]

[[skill]]
name = "explainer-pages"
# ページを書く時だけ
[[skill.when]]
tools = ["Write", "Edit", "MultiEdit"]
path = '{root}/.*(\.html$|/pages/)'

[[skill]]
name = "explainer-shape"
# 説明のページ (.html) を書く時だけ (= タブのメモを書くだけなら読まない)
[[skill.when]]
tools = ["Write", "Edit", "MultiEdit"]
path = '{root}/.*\.html$'

[[skill]]
name = "automation-machinery"
[[skill.when]]
tools = ["Write", "Edit", "MultiEdit"]
path = '{root}/\.tooling/'

[[skill]]
name = "rule-registry"
[[skill.when]]
tools = ["Write", "Edit", "MultiEdit"]
path = '{root}/(.*/)?rules/'

[[skill]]
name = "implementation-plan"
[[skill.when]]
tools = ["Write", "Edit", "MultiEdit"]
path = '{root}/(.*/)?plans/'

[[skill]]
name = "base-sync"
[[skill.when]]
tools = ["Bash"]
command = '(sync-from-base|promote-to-base)\.sh|\bplatform\s+(build|cutover|rollback)\b'

[[skill]]
name = "public-repo"
[[skill.when]]
tools = ["Write", "Edit", "MultiEdit"]
path = '/agent-platform/tools/[^/]+(\.worktrees/[^/]+)?/(README[^/]*\.md$|docs/)'
[[skill.when]]
tools = ["Bash"]
command = '\bgh\s+pr\s+create\b'
cwd = '/agent-platform/tools/'

[[skill]]
name = "session-end"
[[skill.when]]
event = "UserPromptSubmit"
# 操作者が打っていない発話 (別のタブの連絡・client の知らせ・体の完了の知らせ) の本文の言葉では当てない
# 「終わりまで」「終わりに」の類の言い回しでは当てない
prompt = '<session-rollover phase="close">|^(?!Message from |Sent by the client|Tab opened by the client|<task-notification>)[\s\S]*(終わり(?![まにのをへ])|締めよう|今日はここまで|寝る)'

[[skill]]
name = "external-implementation"
[[skill.when]]
tools = ["Bash"]
command = '\bgit\s+clone\b|\buv\s+add\b|\bpnpm\s+add\b|\bpip\s+install\b'
[[skill.when]]
tools = ["Write", "Edit", "MultiEdit"]
path = '/third_party/'
