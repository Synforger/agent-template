# どの操作の時に、 どの skill を読ませるか (= この agent だけの行。 skill_gate.py が、 型が配る
# skill-triggers.base.toml の上に重ねて読む)。 型が配る skill の行は型の表が持つので、 ここには書かない。
#
# ここに書くのは、 この agent だけの skill と、 使う plugin の skill と、 型の行へ足す条件 (= 同じ name で書く)。
# 型の行を外す時は、 同じ name の [[skill]] に off = true を書く。
# name は Skill の道具で呼ぶ名前 (= plugin の skill は <plugin>:<skill>)。
# file は SKILL.md の在処で、 plugin の skill には書く (= 省くとこの agent の .claude/skills/<name>/SKILL.md)。
# 条件と file の書き方は skill_triggers.py の先頭。 {root} はこの agent の folder、 {platform} は器の根。
#
# 例 (= この agent だけの skill):
# [[skill]]
# name = "my-skill"
# [[skill.when]]
# tools = ["Bash"]
# command = '\bmy-command\b'
